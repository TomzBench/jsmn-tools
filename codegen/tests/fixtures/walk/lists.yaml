openapi: 3.1.0
servers:
  - url: https://example.com
    variables:
      region:
        default: us
security:
  - apiKey: []
paths:
  /items:
    parameters:
      - name: limit
        in: query
        schema:
          anyOf:
            - type: integer
            - type: "null"
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                prefixItems:
                  - type: string
                enum:
                  - [a]
