openapi: "3.1.0"
$id: "forge://test/render-vla/v0"
info:
  title: VLA combination render tests
  version: "0.1.0"
components:
  schemas:
    # All 8 three-deep VLA/fixed combos of u32
    # Dims: inner=3, middle=4, outer=5
    # VLA = maxItems only, Fixed = minItems == maxItems
    vla_combos:
      type: object
      x-jsmn-type: vla_combos
      required: [d_vvv, d_vvf, d_vfv, d_vff, d_fvv, d_fvf, d_ffv, d_fff]
      properties:
        # vvv: vla(5) -> vla(4) -> vla(3) -> u32
        d_vvv:
          type: array
          maxItems: 5
          items:
            type: array
            maxItems: 4
            items:
              type: array
              maxItems: 3
              items: { type: integer, format: uint32 }

        # vvf: vla(5) -> vla(4) -> fixed(3) -> u32
        d_vvf:
          type: array
          maxItems: 5
          items:
            type: array
            maxItems: 4
            items:
              type: array
              minItems: 3
              maxItems: 3
              items: { type: integer, format: uint32 }

        # vfv: vla(5) -> fixed(4) -> vla(3) -> u32
        d_vfv:
          type: array
          maxItems: 5
          items:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: array
              maxItems: 3
              items: { type: integer, format: uint32 }

        # vff: vla(5) -> fixed(4) -> fixed(3) -> u32
        d_vff:
          type: array
          maxItems: 5
          items:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: array
              minItems: 3
              maxItems: 3
              items: { type: integer, format: uint32 }

        # fvv: fixed(5) -> vla(4) -> vla(3) -> u32
        d_fvv:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: array
            maxItems: 4
            items:
              type: array
              maxItems: 3
              items: { type: integer, format: uint32 }

        # fvf: fixed(5) -> vla(4) -> fixed(3) -> u32
        d_fvf:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: array
            maxItems: 4
            items:
              type: array
              minItems: 3
              maxItems: 3
              items: { type: integer, format: uint32 }

        # ffv: fixed(5) -> fixed(4) -> vla(3) -> u32
        d_ffv:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: array
              maxItems: 3
              items: { type: integer, format: uint32 }

        # fff: fixed(5) -> fixed(4) -> fixed(3) -> u32
        d_fff:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: array
              minItems: 3
              maxItems: 3
              items: { type: integer, format: uint32 }

    # A property that references a named array is that type, required and
    # optional alike. No mangled twin of its shape is emitted.
    named_row:
      type: array
      x-jsmn-type: named_row
      maxItems: 3
      items: { type: integer, format: uint8 }
    named_host:
      type: object
      x-jsmn-type: named_host
      required: [row]
      properties:
        row:
          $ref: '#/components/schemas/named_row'
        maybe_row:
          $ref: '#/components/schemas/named_row'
    # Two names with one shape stay two types; the property gets the one it
    # referenced.
    twin_a:
      type: array
      x-jsmn-type: twin_a
      maxItems: 2
      items: { type: integer, format: uint16 }
    twin_b:
      type: array
      x-jsmn-type: twin_b
      maxItems: 2
      items: { type: integer, format: uint16 }
    twin_host:
      type: object
      x-jsmn-type: twin_host
      required: [pick]
      properties:
        pick:
          $ref: '#/components/schemas/twin_a'
    # A named fixed array as a property and as the items of another array.
    fixed_row:
      type: array
      x-jsmn-type: fixed_row
      minItems: 2
      maxItems: 2
      items: { type: integer, format: uint8 }
    fixed_host:
      type: object
      x-jsmn-type: fixed_host
      required: [row, grid]
      properties:
        row:
          $ref: '#/components/schemas/fixed_row'
        maybe_row:
          $ref: '#/components/schemas/fixed_row'
        grid:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/fixed_row'
